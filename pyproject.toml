[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "lab-instruments"
version = "0.3.0"
description = "Bounded AD3, SDS804X HD oscilloscope and SDL1020X-E load operations for embedded agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nitmi" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11", "hatchling==1.32.4"]

[project.scripts]
lab-instruments = "lab_instruments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_instruments"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
